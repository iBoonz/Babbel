[project]
name = "babbel"
version = "0.1.0"
description = "Phone-first AI companion for older people in Flanders (spec v0.1: prototype and pilot MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",  # Postgres in the pilot
]

[project.optional-dependencies]
agent = [
  "livekit-agents[openai,silero]>=1.8",
  "livekit-api>=1.2",
]
asr = ["jiwer>=3.0"]
bakeoff = ["anthropic>=2.14"]  # model bake-off: Claude via the Anthropic SDK
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
babbel-api = "babbel.api.main:run"
babbel-scheduler = "babbel.api.scheduler_runner:main"
babbel-evals = "babbel.evals.run:main"
babbel-bakeoff = "babbel.evals.bakeoff:main"
babbel-topics = "babbel.api.topics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babbel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long Flemish strings and test fixtures; keep code lines short by habit
