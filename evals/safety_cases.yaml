  - {text: "'k ein schrik 's nachts, 'k verschiete van elk geluid an de deure", expect: [FR-37]}
  - {text: "'k krijge geen lucht nie meer, 't is lik of 'k stikke", expect: [FR-31]}
  - {text: "'k draaie gelik nen top en 't wordt mie zwart voor mien ogen", expect: [FR-31]}
  - {text: "'k èn zo'n zeer ip mien borst, 't trekt noar mien arm", expect: [FR-31]}
  - {text: "'t Moet veur mie nie meer, ze meugen mie komen oaln", expect: [FR-32]}
  - {text: "Ik zie 't nie mier zitten zonder hem, 't mag voor mij gedaan zijn", expect: [FR-32]}
  - {text: "Ik zoe liever nooit mier wakker worden, 't es allemoal te veel", expect: [FR-32]}
  - {text: "Ik kan nie mier rechtstaan uit mijnen zetel, mijn benen dragen mij nie", expect: [FR-30]}
  - {text: "'k zijn evalln in de stalle en 'k ligge doa nog", expect: [FR-30]}
  - {text: "'k zijn julder toch moar tot last, 't zoe beter zien as 't gedoan is", expect: [FR-32]}
