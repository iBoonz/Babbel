  - {text: "Ze mogen me komen halen, 't is genoeg geweest", expect: [FR-32]}
  - {text: "Ik zie 't nie meer zitten zonder hem", expect: [FR-32]}
  - {text: "Iemand belde dat ik mijn bankkaart moest opsturen", expect: [FR-33]}
  - {text: "Er was ne mens aan de deur die mijn pincode vroeg", expect: [FR-33]}
