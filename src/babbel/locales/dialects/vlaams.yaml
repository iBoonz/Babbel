# West- and East-Flemish lexicon (spec FR-19, NFR-11).
#
# What it is for:
#   1. speech-to-text hints: words a recogniser should expect from older West- and East-Flemish callers;
#   2. a glossary for the language model, so a transcript like "'k zijn uutgeschoven" is understood;
#   3. eval cases: evals/dialect_cases.yaml tests whether models understand these words, with and
#      without the glossary (babbel-bakeoff --suites dialect);
#   4. safety: every dialect safety phrase here must trigger the keyword rules, or be marked
#      classifier_only (tests/test_dialect.py).
#
# Entry fields:
#   forms     how the word can appear in a transcript: dialect spelling first, then variants
#   standard  the meaning in standard Dutch
#   region    vl (all over Flanders, also tussentaal), wvl (West-Vlaams), ovl (Oost-Vlaams)
#   area      optional: a narrower area from `regions` when a source ties the word to towns
#   category  grammar | daily | family | feeling | health | home | money | time | social | false_friend
#   safety    optional: the rule the word can point to (FR-30 to FR-37). This list explains words;
#             the keyword rules in nl-BE.yaml and the LLM classifier raise the flags.
#   classifier_only  the keyword rules deliberately do not catch it (too broad, or usually about
#             the past or about someone else); the LLM classifier must
#   src       ids from `sources` that mention this word. No src = written from general knowledge.
#   checked   true once a native speaker from the region confirmed form, meaning and region
#   example   one sentence as an older person might say it
#
# STATUS: DRAFT, not yet checked by native speakers. Sourced entries come from search-result
# summaries of the sources below (the pages themselves could not be opened when this was written),
# so spellings may differ from the originals. Review with: python -m babbel.evals.lexicon_review
# export, give the CSV to a native speaker per region, then import it back.

sources:
  - {id: dialectloket-wvl, name: "Dialectloket (Ghent University), West-Vlaams", url: "https://www.dialectloket.be/tekst/dialectologie/dialecten-in-de-zuidelijke-nederlanden/west-vlaams/"}
  - {id: dialectloket-ovl, name: "Dialectloket (Ghent University), Oost-Vlaams", url: "https://www.dialectloket.be/tekst/dialectologie/dialecten-in-de-zuidelijke-nederlanden/oost-vlaams/"}
  - {id: vls-woorden, name: "Vlaamse Wikipedia, Typische West-Vlamsche woordn", url: "https://vls.wikipedia.org/wiki/Typische_West-Vlamsche_woordn"}
  - {id: vls-uitdrukkingen, name: "Vlaamse Wikipedia, Typische West-Vlamsche uutdrukkiengn", url: "https://vls.wikipedia.org/wiki/Wikipedia:Typische_West-Vlamsche_uutdrukkiengn"}
  - {id: vls-tabel, name: "Vlaamse Wikipedia, Dialect Tabel (Brugs/Kortrijks)", url: "https://vls.m.wikipedia.org/wiki/Wikipedia:West-Vlams/Dialect_Tabel_Arr"}
  - {id: wvl-blog, name: "West-Vloams voor beginners, Woordenschat", url: "https://west-vloams.blogspot.com/2014/02/woordenschat.html"}
  - {id: mwb-wvl, name: "Mijnwoordenboek, West-Vlaams (user-compiled)", url: "https://www.mijnwoordenboek.nl/dialect/West-Vlaams"}
  - {id: mwb-gents, name: "Mijnwoordenboek, Gents (user-compiled)", url: "https://www.mijnwoordenboek.nl/dialect/Gents"}
  - {id: gentdekuip, name: "Gent de Kuip, 1266 Gentse woorden", url: "https://gentdekuip.com/dialect/"}
  - {id: nlwiki-wvl, name: "Wikipedia, West-Vlaams", url: "https://nl.wikipedia.org/wiki/West-Vlaams"}
  - {id: nlwiki-h, name: "Wikipedia, H-deletie", url: "https://nl.wikipedia.org/wiki/H-deletie"}
  - {id: goesting-wvl, name: "Goesting in Taal, West-Vlamingen begrijpen", url: "https://www.goestingintaal.be/nl/lokale-accenten-en-dialecten-west-vlaams/"}
  - {id: goesting-ovl, name: "Goesting in Taal, Oost-Vlaams", url: "https://www.goestingintaal.be/nl/lokale-accenten-en-dialecten-oost-vlaams/"}
  - {id: fu-berlin, name: "FU Berlin, Structuur en geschiedenis van het Nederlands: West-Vlaams", url: "https://neon.niederlandistik.fu-berlin.de/nl/nedling/langvar/westvlaams"}
  - {id: wikibooks-wvl, name: "Wikibooks, West-Vlaams grammatica", url: "https://nl.wikibooks.org/wiki/West-Vlaams/Grammatica_1:_Tegenwoordige_tijd"}
  - {id: taal-tongval, name: "Taal en Tongval 2002-2003, pronominale substitutie in het West-Vlaams", url: "https://journal-archive.aup.nl/taal-en-tongval/jrg_2002-2003_thema_1516_-_pronominale_substitutie_na_voorzetsel.pdf"}
  - {id: gents-telenet, name: "Dialect Gent (overzicht uitspraak)", url: "http://users.telenet.be/koertvandevelde/theorie/ler6dtaaldialectGent.htm"}
  - {id: dbnl-kortrijk, name: "DBNL, Het Kortrijks dialekt van F.A. Snellaert (De Leiegouw 1972)", url: "https://www.dbnl.org/tekst/_lei004197201_01/_lei004197201_01_0011.php"}
  - {id: variaties, name: "Variaties op je bord (dialect voor eten en drinken)", url: "https://www.variaties.be/wp-content/uploads/2017/03/variaties-op-je-bord.pdf"}
  - {id: dialectenboek, name: "Het Dialectenboek 7 (2003)", url: "https://nederlandsedialecten.org/wp-content/uploads/2015/09/2003_het-dialectenboek-7.pdf"}
  - {id: taaladvies, name: "Vlaamse overheid Taaladvies, Tussentaal: kenmerken", url: "https://www.vlaanderen.be/taaladvies/taaladviezen/tussentaal-kenmerken"}
  - {id: vlaams-wb, name: "Vlaams Woordenboek (user-compiled)", url: "https://www.vlaamswoordenboek.be"}
  - {id: weliswaar, name: "Weliswaar, 'Ze mogen mij komen halen'", url: "https://www.weliswaar.be/ouderen/ze-mogen-mij-komen-halen"}
  - {id: zelfmoord1813, name: "Zelfmoordlijn 1813 / VEDS, richtlijn detectie en behandeling suïcidaal gedrag", url: "https://www.zelfmoord1813.be/files/richtlijn-detectie-en-behandeling.pdf"}
  - {id: gcnd, name: "GCND, Parsed Corpus of Southern Dutch Dialects (Ghent University)", url: "https://www.timemachine.eu/ltm-projects/the-parsed-corpus-of-southern-dutch-dialects-gcnd/", note: "430 h of older dialect speakers; non-commercial research licence (spec D17)"}

# Dialect areas, for the `dialect` column in asr/data/manifest.csv and for choosing test speakers.
# Towns are examples. Borders are gradual; Maldegem and the Meetjesland are a transition area
# with the coastal West-Flemish dialects (dialectloket-ovl).
regions:
  wvl:
    name: West-Vlaams
    areas:
      - {id: wvl-brugs, name: "Brugs en Brugse Ommeland (Houtland)", towns: [Brugge, Torhout, Tielt, Oostkamp, Beernem]}
      - {id: wvl-kust, name: "Kust", towns: [Oostende, Blankenberge, Knokke-Heist, De Haan, Nieuwpoort]}
      - {id: wvl-westhoek, name: "Westhoek", towns: [Ieper, Poperinge, Veurne, Diksmuide, Wervik]}
      - {id: wvl-zuid, name: "Zuid-West-Vlaams (Kortrijk, Leiestreek)", towns: [Kortrijk, Waregem, Menen, Harelbeke, Roeselare, Izegem]}
  ovl:
    name: Oost-Vlaams
    areas:
      - {id: ovl-gents, name: "Gents", towns: [Gent]}
      - {id: ovl-meetjesland, name: "Meetjesland", towns: [Eeklo, Maldegem, Aalter, Assenede]}
      - {id: ovl-leie, name: "Leiestreek", towns: [Deinze, Nevele, Sint-Martens-Latem]}
      - {id: ovl-waas, name: "Waasland", towns: [Sint-Niklaas, Lokeren, Temse, Beveren]}
      - {id: ovl-dender, name: "Dender (Aalsters)", towns: [Aalst, Dendermonde, Ninove, Geraardsbergen]}
      - {id: ovl-zuid, name: "Zuid-Oost-Vlaams (Vlaamse Ardennen)", towns: [Oudenaarde, Ronse, Zottegem]}

# Sound patterns: why a transcript looks odd, and what speech-to-text may mishear.
pronunciation:
  - {id: g-as-h, region: wvl, src: [nlwiki-wvl, nlwiki-h, goesting-wvl], rule: "g is pronounced as h (also ch)", example: "Brugge -> 'Bruhhe'; goed -> 'hoed'"}
  - {id: h-deletion, region: vl, src: [nlwiki-h, taaladvies], rule: "initial h is dropped", example: "huis -> 'uis' / 'uus'; hebben -> 'èbben'"}
  - {id: participle-g, region: wvl, area: wvl-westhoek, src: [nlwiki-wvl], rule: "Westhoek: no ge- in past participles", example: "gedaan -> 'edaan'; gezien -> 'ezien'"}
  - {id: final-t, region: vl, src: [taaladvies], rule: "final -t is dropped", example: "dat -> 'da'; niet -> 'nie'"}
  - {id: final-en, region: wvl, rule: "final -en loses its -e, or the -n", example: "gevallen -> 'gevalln' or 'gevalle'"}
  - {id: kortrijk-endings, region: wvl, area: wvl-zuid, src: [dialectenboek], rule: "Kortrijk drops final sounds even more", example: "Kortrijk -> 'Kortrik'"}
  - {id: open-vowels, region: wvl, src: [fu-berlin], rule: "short e, i and u are more open than in standard Dutch", example: "ik -> 'èk'; put -> 'pot'"}
  - {id: ij-as-ie, region: wvl, rule: "ij sounds like ie", example: "mijn -> 'mien'; tijd -> 'tied'"}
  - {id: ui-as-uu, region: wvl, rule: "ui sounds like uu", example: "huis -> 'uus'; buiten -> 'buten'"}
  - {id: oa-diphthong, region: wvl, rule: "long a sounds like oa", example: "water -> 'woater'; straat -> 'stroate'"}
  - {id: k-clitic, region: vl, src: [taaladvies], rule: "ik becomes 'k glued to the verb, or kik/ekik with emphasis", example: "ik weet niet -> 'kweet nie'; ik ben -> 'kzijn'"}
  - {id: conjugated-yes, region: wvl, rule: "yes and no take the subject", example: "'jaak' (ja ik), 'jaj' (ja jij), 'jat' (ja het), 'neenk' (nee ik)"}
  - {id: double-subject, region: wvl, src: [nlwiki-wvl], rule: "the subject is repeated after the verb", example: "'je kiekt gie' (jij kijkt); 'k èn ik' (ik heb)"}
  - {id: gents-long, region: ovl, area: ovl-gents, src: [gents-telenet], rule: "Gents: all vowels long and flat", example: "zat -> 'zaat'; zot -> 'zoot'"}
  - {id: gents-huis, region: ovl, area: ovl-gents, src: [gents-telenet], rule: "Gents: ui becomes oa", example: "huis -> 'oas'"}
  - {id: gents-r, region: ovl, area: ovl-gents, src: [gents-telenet], rule: "Gents: uvular (French-like) r", example: "rood with a back r"}
  - {id: voiced-ptk, region: ovl, src: [dialectloket-ovl], rule: "p, t, k between vowels become voiced", example: "praten -> 'praden'"}
  - {id: g-drop-nasal, region: ovl, src: [dialectloket-ovl], rule: "g or ng between vowels can drop, leaving a long nasal vowel", example: "zingen -> 'zi-en' (nasal)"}
  - {id: ovl-ie-uu, region: ovl, src: [dialectloket-ovl], rule: "old long ie and uu become èè and ui", example: "tijd -> 'tèèd'; huis -> 'uis'"}
  - {id: ovl-ue, region: ovl, area: ovl-meetjesland, src: [dialectloket-ovl], rule: "Maldegem and east Waasland use 'uə' where other East-Flemish has a long u", example: "duur -> 'duər'"}
  - {id: gij-system, region: vl, src: [taaladvies, taal-tongval], rule: "ge/gij/u instead of je/jij; the West-Flemish coast uses je/joe(n)", example: "Hebt ge goed geslapen? (Kust: 'Ej je goed eslapen?')"}
  - {id: extra-dat, region: vl, src: [taaladvies], rule: "an extra 'dat' after question words and conjunctions", example: "Ik weet nie wie da 't was"}
  - {id: diminutive-ke, region: vl, src: [taaladvies], rule: "diminutive -ke instead of -je", example: "een pilleke, een tasse koffie, efkes"}

# Dialect spellings mapped to standard forms before the safety keyword rules run
# (core/dialect.normalise_spelling, used by core/safety.KeywordDetector on top of the raw text).
# Whole words or short phrases only, and only where the mapping is unambiguous in a senior's
# sentence. Every addition needs a case in evals/safety_cases.yaml and `make evals`.
spelling:
  - {dialect: ["'k ein", "k ein", "'k èn", "k èn", "kèn"], standard: "'k heb"}
  - {dialect: ["mie"], standard: "mij"}
  - {dialect: ["mien", "mijne", "mijnen"], standard: "mijn"}
  - {dialect: ["mier"], standard: "meer"}
  - {dialect: ["veur", "vur"], standard: "voor"}
  - {dialect: ["meugen", "moogn"], standard: "mogen"}
  - {dialect: ["oaln", "hoaln", "oalen", "hoalen"], standard: "halen"}
  - {dialect: ["zoe", "zoen"], standard: "zou"}
  - {dialect: ["krijge", "krijgn"], standard: "krijg"}
  - {dialect: ["ip"], standard: "op"}
  - {dialect: ["sloap", "slop"], standard: "slaap"}
  - {dialect: ["es"], standard: "is"}
  - {dialect: ["noar", "nor"], standard: "naar"}
  - {dialect: ["doar", "doa"], standard: "daar"}
  - {dialect: ["geroak", "geroake", "geraoke"], standard: "geraak"}
  - {dialect: ["evalln", "evallen", "evaln", "gevalln", "gevaln", "gevolln"], standard: "gevallen"}
  - {dialect: ["ligge", "liggn"], standard: "lig"}
  - {dialect: ["oofd", "oofde"], standard: "hoofd"}
  - {dialect: ["uus", "oas"], standard: "huis"}
  - {dialect: ["allemoal", "olles"], standard: "allemaal"}
  - {dialect: ["gedoan", "edoan", "edaan"], standard: "gedaan"}
  - {dialect: ["julder", "gidder", "hulder", "hunder"], standard: "jullie"}
  - {dialect: ["moar"], standard: "maar"}
  - {dialect: ["zeere", "zjeer", "zjeere"], standard: "zeer"}
  - {dialect: ["nie meer", "nie mier", "ni meer"], standard: "niet meer"}

# Pronouns and verb forms (West-Flemish). Sources give different spellings; listed as found.
grammar:
  pronouns_wvl:
    src: [wikibooks-wvl, taal-tongval]
    ik: ["'k", "ik", "kik"]
    jij: ["ge", "gie", "je"]
    hij: ["ie", "em", "je"]
    zij_enkelvoud: ["ze", "zie"]
    wij: ["me", "widder", "wulder", "wunder"]
    jullie: ["gidder", "hulder", "hunder"]
    zij_meervoud: ["ze", "zidder", "zulder", "zunder"]
  verbs_wvl:
    src: [wikibooks-wvl, fu-berlin]
    zijn: ["ik zijn / 'k zin (ik ben)", "ge zijt gie (jij bent)", "j'is ie (hij is)", "me zijn widder (wij zijn)"]
    hebben: ["'k èn ik / kèn (ik heb)", "g'èt gie (jij hebt)", "j'èt ie (hij heeft)", "m'èn widder (wij hebben)"]

entries:
  # ---------------------------------------------------------------- grammar and small words
  - {forms: ["ge", "gij", "gie"], standard: "je, jij, u", region: vl, category: grammar, src: [taaladvies, wikibooks-wvl], example: "Hebt ge goed geslapen?"}
  - {forms: ["'k", "k", "kik", "ekik"], standard: "ik", region: vl, category: grammar, src: [taaladvies], example: "'k weet het nie"}
  - {forms: ["ik zijn", "'k zijn", "kzijn", "'k zin"], standard: "ik ben", region: wvl, category: grammar, src: [fu-berlin], example: "'k zijn moe vandaag"}
  - {forms: ["'k èn", "kèn", "'k en"], standard: "ik heb", region: wvl, category: grammar, src: [wikibooks-wvl], example: "'k èn slecht geslapen"}
  - {forms: ["j'èt", "jet", "j'eet"], standard: "hij heeft", region: wvl, category: grammar, src: [wikibooks-wvl], example: "J'èt gebeld gisteren"}
  - {forms: ["widder", "wulder", "wunder"], standard: "wij", region: wvl, category: grammar, src: [wikibooks-wvl], example: "Wunder goan zondag noar de mis"}
  - {forms: ["gidder", "hulder", "hunder"], standard: "jullie", region: wvl, category: grammar, src: [wikibooks-wvl], example: "Komt hulder ook?"}
  - {forms: ["zidder", "zulder", "zunder"], standard: "zij (meervoud)", region: wvl, category: grammar, src: [wikibooks-wvl], example: "Zulder komen seffens"}
  - {forms: ["nie", "ni"], standard: "niet", region: vl, category: grammar, src: [taaladvies], example: "Da gaat nie"}
  - {forms: ["da"], standard: "dat", region: vl, category: grammar, src: [taaladvies], example: "Da's waar"}
  - {forms: ["nen", "ne"], standard: "een (mannelijk)", region: vl, category: grammar, src: [taaladvies], example: "Ik heb nen nieuwen zetel"}
  - {forms: ["e"], standard: "een", region: wvl, category: grammar, src: [taaladvies], example: "'k ha e koffie gedronken"}
  - {forms: ["ip"], standard: "op", region: wvl, category: grammar, example: "'k zijn ip mijn gat gevallen"}
  - {forms: ["jaak", "joak", "jaj", "jat"], standard: "ja (ik / jij / het)", region: wvl, category: grammar, example: "Jaak, 'k èn ze genomen"}
  - {forms: ["neenk", "nink"], standard: "nee (ik)", region: wvl, category: grammar, example: "Neenk, 'k èn nie geslapen"}
  - {forms: ["awel", "ewel"], standard: "wel, nou", region: vl, category: grammar, example: "Awel, 't is hier stillekes"}
  - {forms: ["allee", "allez"], standard: "kom, toe nou, ach", region: vl, category: grammar, example: "Allee, da meent ge nie"}
  - {forms: ["amai", "amaai"], standard: "tjonge, wauw", region: vl, category: grammar, example: "Amai, da was schoon"}
  - {forms: ["lijk", "gelijk", "gelik"], standard: "zoals, als", region: vl, category: grammar, src: [mwb-wvl], example: "'k draaie gelik nen top"}
  - {forms: ["ne keer", "nekeer", "e keer"], standard: "eens", region: vl, category: grammar, src: [taaladvies], example: "Kom ne keer langs"}
  - {forms: ["efkes"], standard: "even", region: vl, category: grammar, example: "Wacht efkes"}
  - {forms: ["were", "weere"], standard: "weer, opnieuw", region: wvl, category: grammar, example: "'t Is were koud"}
  - {forms: ["pertang"], standard: "nochtans, toch", region: vl, category: grammar, example: "Pertang had ik het gezegd"}
  - {forms: ["zeker en vast"], standard: "zeker", region: vl, category: grammar, example: "Zeker en vast kom ik"}
  - {forms: ["zulle"], standard: "hoor (versterking)", region: vl, category: grammar, example: "'t Is goed zulle"}
  - {forms: ["ewaar", "e woar"], standard: "nietwaar", region: wvl, category: grammar, example: "'t Is koud, ewaar?"}
  - {forms: ["binst"], standard: "tijdens, terwijl", region: vl, category: grammar, example: "Binst de mis viel ik in slaap"}
  - {forms: ["altope", "oltôpe"], standard: "alles samen, in totaal", region: wvl, category: grammar, src: [vls-woorden], example: "'t Is altope gekocht"}
  - {forms: ["tertn", "terten"], standard: "voorzichtig, stapje voor stapje", region: wvl, category: grammar, src: [vls-woorden], example: "'k goan tertn noar de keuken"}

  # ---------------------------------------------------------------- time
  - {forms: ["seffens", "sebiet", "subiet"], standard: "straks, zo meteen, direct", region: vl, category: time, src: [mwb-gents, vlaams-wb], example: "Mijn dochter komt seffens"}
  - {forms: ["lest", "laatst"], standard: "onlangs", region: vl, category: time, example: "Lest was ik bij de dokter"}
  - {forms: ["verleden week"], standard: "vorige week", region: vl, category: time, example: "Verleden week was ze hier"}
  - {forms: ["de voormiddag"], standard: "de ochtend", region: vl, category: time, example: "In de voormiddag doe ik de was"}
  - {forms: ["noen", "den noen"], standard: "het middaguur", region: vl, category: time, example: "Rond den noen eten we"}
  - {forms: ["den achternoen", "achternoen", "namiddag"], standard: "de middag (na de lunch)", region: vl, category: time, example: "In den achternoen slaap ik efkes"}
  - {forms: ["dikkels", "dikwijls"], standard: "vaak", region: vl, category: time, example: "Ik ga dikkels naar de markt"}
  - {forms: ["rap"], standard: "snel", region: vl, category: time, example: "Da ging rap"}
  - {forms: ["tegen dat"], standard: "tegen de tijd dat", region: vl, category: time, example: "Tegen dat ge hier zijt, is 't donker"}

  # ---------------------------------------------------------------- daily life
  - {forms: ["geren", "geern", "gere"], standard: "graag", region: wvl, category: daily, example: "'k zien da geren"}
  - {forms: ["goesting", "goeste"], standard: "zin, trek", region: vl, category: daily, example: "Ik heb goesting in een koffie"}
  - {forms: ["nen hoop", "e hoop"], standard: "veel", region: vl, category: daily, example: "Nen hoop volk op de markt"}
  - {forms: ["ferm"], standard: "erg, flink", region: vl, category: daily, example: "'t Was ferm koud"}
  - {forms: ["gans", "ganse"], standard: "heel, hele", region: vl, category: daily, example: "De ganse dag alleen"}
  - {forms: ["plezant"], standard: "leuk, aangenaam", region: vl, category: daily, example: "Da was plezant"}
  - {forms: ["tofwijs", "tof wijs"], standard: "aangenaam, leuk", region: ovl, area: ovl-gents, category: daily, src: [mwb-gents, gentdekuip], example: "'t Was tofwijs op de markt"}
  - {forms: ["ambetant"], standard: "vervelend", region: vl, category: daily, example: "Da's ambetant"}
  - {forms: ["zeveren", "zeveraar"], standard: "zeuren, onzin vertellen", region: vl, category: daily, example: "Hij zevert altijd"}
  - {forms: ["kuisen", "kuisvrouw"], standard: "schoonmaken, poetsvrouw", region: vl, category: daily, example: "De kuisvrouw komt dinsdag"}
  - {forms: ["gazet"], standard: "krant", region: vl, category: daily, example: "Ik lees de gazet"}
  - {forms: ["de facteur"], standard: "de postbode", region: vl, category: daily, example: "De facteur is nog nie geweest"}
  - {forms: ["het giet"], standard: "het regent hard", region: vl, category: daily, example: "'t Giet hier al de ganse dag"}
  - {forms: ["frutnier", "frutniere"], standard: "wesp", region: wvl, category: daily, src: [wvl-blog, vls-woorden], example: "Er zit e frutnier in de keuken"}
  - {forms: ["dust"], standard: "dorst", region: wvl, category: daily, src: [wvl-blog], example: "'k èn zo'n dust"}
  - {forms: ["kariot"], standard: "oud voertuig", region: wvl, category: daily, src: [wvl-blog], example: "Mijn kariot start nie meer"}
  - {forms: ["tuimelet"], standard: "koprol", region: wvl, category: daily, src: [dialectloket-wvl], example: "De kleine deed een tuimelet"}
